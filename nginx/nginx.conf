# ============================================================================
# nginx.conf chính (thay cho file mặc định của image nginx:alpine).
#
# Lý do dùng file riêng: nginx.conf mặc định có sẵn
#   access_log /var/log/nginx/access.log main;
# với log_format "main" chứa nguyên $request (bao gồm query string). Nếu chỉ
# thêm JSON log trong conf.d thì nginx sẽ ghi CẢ HAI định dạng, vô tình làm lộ
# query string và tăng dung lượng log. File này bỏ log mặc định, chỉ dùng
# json_combined định nghĩa trong 00-shared.conf (dùng $uri, không có query).
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 00-shared.conf được include trước (thứ tự alphabet) và định nghĩa
    # log_format/json access_log, limit_req_zone, upstream dùng chung.
    include /etc/nginx/conf.d/*.conf;
}
