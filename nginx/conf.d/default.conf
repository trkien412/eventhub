# ============================================================================
# Nginx reverse proxy cho EventHub (HTTP nội bộ/đồ án).
# Các directive dùng chung (log_format, limit_req_zone, upstream) nằm trong
# 00-shared.conf để server HTTPS có thể tái sử dụng mà không khai báo trùng.
# Với domain + HTTPS thật, xem nginx/https.conf.example và README.md.
# ============================================================================

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    # Header bảo mật áp dụng cho mọi response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Header chung cho MỌI location proxy sang Gunicorn. Đặt ở server để
    # không lặp lại và tránh thiếu header ở một route nào đó.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_redirect off;

    # Không công khai endpoint Prometheus. Prometheus scrape trực tiếp web:8000.
    location = /metrics {
        return 404;
    }

    # Healthcheck nội bộ cho Docker/Nginx.
    location = /healthz {
        proxy_pass http://django_app;
        access_log off;
    }

    # File tĩnh do collectstatic tạo ra trong volume static_data.
    location /static/ {
        root /var/www;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /media/ {
        root /var/www;
        try_files $uri =404;
        expires 1d;
        access_log off;
    }

    # Django admin cần inline style/script của chính Django; CSP được nới
    # riêng tại đây. Trong production nên giới hạn IP hoặc tắt nếu không dùng.
    location /django-admin/ {
        limit_req zone=auth burst=20 nodelay;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'" always;

        proxy_pass http://django_app;
    }

    # Giới hạn chặt hơn cho các endpoint xác thực.
    location = /accounts/login/ {
        limit_req zone=auth burst=8 nodelay;
        proxy_pass http://django_app;
    }

    location = /accounts/register/ {
        limit_req zone=auth burst=8 nodelay;
        proxy_pass http://django_app;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://django_app;
    }

    # Chặn truy cập file ẩn (.git, .env...) nếu vô tình mount vào web root.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
