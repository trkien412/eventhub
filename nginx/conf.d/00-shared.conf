# Cấu hình dùng chung trong http context (được include tự động bởi nginx.conf).
# Tách riêng để có thể thêm server HTTPS mà không khai báo trùng.

# Không ghi referer/user_agent: referer có thể chứa query string/token,
# user_agent có thể dùng để fingerprint. Chỉ giữ dữ liệu vận hành tối thiểu.
log_format json_combined escape=json
  '{"time":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time"}';

# Chỉ dùng JSON log, không ghi query string (tránh lộ token/tìm kiếm).
access_log /var/log/nginx/access.log json_combined;

# Giới hạn request cơ bản, chống lạm dụng form đăng nhập.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

upstream django_app {
    server web:8000;
    keepalive 16;
}
